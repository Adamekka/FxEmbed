name: Daily upstream rebase

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-rebase
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Adamekka/FxEmbed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.rebase.outputs.changed }}
      base: ${{ steps.rebase.outputs.base }}
      candidate: ${{ steps.rebase.outputs.candidate }}
      upstream: ${{ steps.rebase.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto upstream main
        id: rebase
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git fetch --no-tags https://github.com/FxEmbed/FxEmbed.git main
          upstream=$(git rev-parse FETCH_HEAD)

          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'main already includes upstream/main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rebase --no-fork-point "$upstream"; then
            git rebase --abort
            echo '::error::Upstream rebase conflicted. Resolve the rebase manually; main was not changed.'
            exit 1
          fi

          {
            echo 'changed=true'
            echo "base=$base"
            echo "candidate=$(git rev-parse HEAD)"
            echo "upstream=$upstream"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.rebase.outputs.changed == 'true'
        with:
          node-version: '24.14.1'
          cache: npm

      - name: Prepare build configuration
        if: steps.rebase.outputs.changed == 'true'
        run: |
          cp wrangler.example.toml wrangler.toml
          cp .env.example .env
          cp branding.example.json branding.json

      - name: Install dependencies
        if: steps.rebase.outputs.changed == 'true'
        run: npm ci

      - name: Build and test the rebased commit
        if: steps.rebase.outputs.changed == 'true'
        run: |
          npm run build
          npm test -- --run

      - name: Bundle the validated commit
        if: steps.rebase.outputs.changed == 'true'
        env:
          CANDIDATE: ${{ steps.rebase.outputs.candidate }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --exit-code HEAD
          git bundle create "$RUNNER_TEMP/upstream-rebase.bundle" HEAD

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.rebase.outputs.changed == 'true'
        with:
          name: upstream-rebase
          path: ${{ runner.temp }}/upstream-rebase.bundle
          if-no-files-found: error
          retention-days: 1

  # Build and test scripts never receive the credential that can rewrite main.
  publish:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-rebase
          path: ${{ runner.temp }}

      - name: Publish the validated rebase
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          BASE: ${{ needs.validate.outputs.base }}
          CANDIDATE: ${{ needs.validate.outputs.candidate }}
          UPSTREAM: ${{ needs.validate.outputs.upstream }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Set UPSTREAM_SYNC_TOKEN with Contents, Pull requests, and Workflows write permissions.}"

          git init --bare "$RUNNER_TEMP/publish.git"
          cd "$RUNNER_TEMP/publish.git"
          git fetch "$RUNNER_TEMP/upstream-rebase.bundle" HEAD:refs/heads/candidate
          test "$(git rev-parse candidate)" = "$CANDIDATE"
          git merge-base --is-ancestor "$UPSTREAM" candidate

          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "$BASE" ]; then
            echo '::error::main changed while CI was running. Rerun the workflow to validate a fresh rebase.'
            exit 1
          fi

          branch="automation/upstream-rebase-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "candidate:refs/heads/$branch"
          cat > "$RUNNER_TEMP/upstream-rebase-pr.md" <<EOF
          Automatically rebase main onto FxEmbed/FxEmbed at $UPSTREAM.

          Build and tests passed for $CANDIDATE in this workflow run:
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Publication uses a lease against $BASE so concurrent changes to main are preserved.
          EOF
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title 'ci: rebase main onto upstream' --body-file "$RUNNER_TEMP/upstream-rebase-pr.md")
          echo "$pr" >> "$GITHUB_STEP_SUMMARY"

          # A merge would retain the old commit order instead of publishing the tested rebase.
          git push --force-with-lease="refs/heads/main:$BASE" origin candidate:refs/heads/main
          git push origin --delete "$branch"
          echo "Published $CANDIDATE onto main after build and tests passed." >> "$GITHUB_STEP_SUMMARY"
