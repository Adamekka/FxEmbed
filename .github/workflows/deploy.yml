name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ['Tests']
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run also receives PR results; only tested pushes from this fork may deploy.
    if: >-
      github.repository == 'Adamekka/FxEmbed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    name: Deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check for a newer push
        id: current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$TESTED_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is on main; skipping this older deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24.14.1'
          cache: npm

      - name: Restore instance configuration
        if: steps.current.outputs.deploy == 'true'
        env:
          FXEMBED_WRANGLER: ${{ vars.FXEMBED_WRANGLER }}
          FXEMBED_ENV: ${{ secrets.FXEMBED_ENV }}
          FXEMBED_BRANDING: ${{ vars.FXEMBED_BRANDING }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';

          for (const [name, path] of [
            ['FXEMBED_WRANGLER', 'wrangler.toml'],
            ['FXEMBED_ENV', '.env'],
            ['FXEMBED_BRANDING', 'branding.json']
          ]) {
            const contents = process.env[name];
            if (typeof contents !== 'string' || contents.trim() === '') {
              throw new Error(`Required GitHub Actions configuration ${name} is missing.`);
            }
            writeFileSync(path, contents);
          }
          JS

      - name: Install dependencies
        if: steps.current.outputs.deploy == 'true'
        run: npm ci

      - name: Build and deploy with Wrangler
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret.}"
          npm run deploy
